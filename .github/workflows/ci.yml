# NimbusShell CI — lint local + checks (sin secretos, sin sudo).
name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar shellcheck y python3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck python3
      - name: CI local
        run: bash scripts/ci.sh
