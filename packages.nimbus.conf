# =============================================================================
# NimbusShell — packages.nimbus.conf (paquetes de REPOS OFICIALES)
# Derivado de NimbusOS `packages.nimbus.x86_64.append` (2026-10-27).
# Solo pacman (extra/core/cachyos). El AUR vive en packages.nimbus-aur.txt.
#
# EXCLUSIONES respecto al append de NimbusOS (Rulings, ver README):
#   R1 greetd: es el Display Manager del live/instalado ISO. NimbusShell no
#      toca tu login: usas tu DM o `Hyprland` desde TTY tal como ya lo haces.
#   R2 whitesur-gtk-theme whitesur-icon-theme pamac-aur hyprshell
#      hyprland-plugin-hyprbars: son AUR (no los resuelve pacstrap/pacman);
#      viven en packages.nimbus-aur.txt y los instala paru (o este script
#      los compila si hace falta). pamac-aur arrastra libpamac-aur solo.
#   R3 plymouth/calamares: ni siquiera estan en el append (plymouth omitido
#      aguas arriba por falta de HOOKS en archiso; Calamares vive en la ISO).
#      Nada que excluir aqui; se documenta para que nadie los "recupere".
#   SE MANTIENE (decision consciente): auto-cpufreq thermald zram-generator
#      nvidia-prime switcheroo-control VA-API/vulkan: power laptop e hibrida
#      tambien tienen sentido en un escritorio instalado, no solo en el live.
#   SE MANTIENE: iptables qt6-multimedia-ffmpeg tesseract-data-eng: fijan
#      prompts interactivos de pacman (proveedores qt6-multimedia/libxtables
#      /tessdata); en instalacion desatendida evitan que pacman se cuelgue.
#   SE MANTIENE: vala meson ninja ... rust sassc gtk3/4 ...: toolchains de
#      compilacion AUR. paru las pediria igual como makedeps; preinstalarlas
#      hace la instalacion no-interactiva y re-ejecutable.
#   SE AÑADE (auditoria superficie MacShell, 2026-10-27): python (SUPER+M y
#      capturas lo exigen) y xdg-utils (xdg-open en la cadena de apertura).
#      No estan en el append aguas arriba; sin ellos hay cadenas rotas.
# =============================================================================

