# NimbusOS netinstall — pacman.conf del perfil ISO (F2-T06).
# Fuente: docs/plans/research/F2-base.md §4a y §8.
# Repos CachyOS pinneados a snapshot 2026-10; el pin se congela en F2-T01
# tras validar en VM (R-CACHYOS). Sin `latest` sin pin.
# Este fichero lo consume mkarchiso dentro del perfil (pacman_conf="pacman.conf").

[options]
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

# Snapshot CachyOS 2026-10 (pin pendiente de congelar en F2-T01).
# Sustituir <SNAPSHOT> por el snapshot validado en VM antes del build final.
[cachyos-v3]
SigLevel = Required DatabaseOptional
Server = https://archive.cachyos.org/repos/<SNAPSHOT>/$repo/$arch

[cachyos-core-v3]
SigLevel = Required DatabaseOptional
Server = https://archive.cachyos.org/repos/<SNAPSHOT>/$repo/$arch

[cachyos-extra-v3]
SigLevel = Required DatabaseOptional
Server = https://archive.cachyos.org/repos/<SNAPSHOT>/$repo/$arch

[core]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/mirrorlist

[extra]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/mirrorlist

[multilib]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/mirrorlist
