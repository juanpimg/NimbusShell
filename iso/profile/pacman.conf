# NimbusOS netinstall — pacman.conf del perfil ISO (F2-T06).
# Fuente: docs/plans/research/F2-base.md §4a y §8.
# Repos CachyOS pinneados a snapshot 2026-10; el pin se congela en F2-T01
# tras validar en VM (R-CACHYOS). Sin `latest` sin pin.
# Este fichero lo consume mkarchiso dentro del perfil (pacman_conf="pacman.conf").

[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

# R-CACHYOS: mirrors estables verificados HTTP 200 (build 2026-10-31).
# El pin por snapshot/fecha se congela tras el primer build validado (F2-T08).
[cachyos-v3]
SigLevel = Required DatabaseOptional
Server = https://mirror.cachyos.org/repo/x86_64_v3/cachyos-v3

[cachyos-core-v3]
SigLevel = Required DatabaseOptional
Server = https://mirror.cachyos.org/repo/x86_64_v3/cachyos-core-v3

[cachyos-extra-v3]
SigLevel = Required DatabaseOptional
Server = https://mirror.cachyos.org/repo/x86_64_v3/cachyos-extra-v3

[cachyos]
SigLevel = Required DatabaseOptional
Server = https://mirror.cachyos.org/repo/x86_64/cachyos

[core]
SigLevel = Required DatabaseOptional
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[extra]
SigLevel = Required DatabaseOptional
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[multilib]
SigLevel = Required DatabaseOptional
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
