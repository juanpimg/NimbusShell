# NimbusOS — Calamares settings.conf (F2-T07).
# Fuente: docs/plans/research/F2-decisions.md (D2, orden unificado F2/F9).
# netinstall = instancia netinstall@nimbus-netinstall (patrón biglinux-livecd).
# removeuser SOLO en OEM (comentado; descomentar únicamente en perfil OEM).
# finished va en show (canónico upstream), NO en exec.
modules-search: [ local ]

instances:
  - id: nimbus-netinstall
    module: netinstall
    config: netinstall-nimbus.conf
  - id: nimbus-shellprocess
    module: shellprocess
    config: shellprocess-nimbus.conf
  - id: bootloader
    module: packagechooser
    config: packagechooser_bootloader.conf
  - id: nimbus-kernel
    module: shellprocess
    config: shellprocess-kernel.conf
  - id: nimbus-efi
    module: shellprocess
    config: shellprocess-efi.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser@bootloader
      - partition
      - users
      - netinstall@nimbus-netinstall
      - summary
  - exec:
      - partition
      - mount
      # Bootstrap del root: pacstrap instala base+linux; después packages/
      # netinstall usan el pacman del target. Sin esto machineid falla.
      - pacstrap
      - packages
      - netinstall@nimbus-netinstall
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@nimbus-kernel
      - bootloader
      - shellprocess@nimbus-efi
      - shellprocess@nimbus-shellprocess
      - umount
  - show:
      - finished
      # - removeuser  # SOLO OEM (dont-chroot); NO descomentar en netinstall

branding: nimbus
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
