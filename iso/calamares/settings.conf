# NimbusOS — Calamares settings.conf (F2-T07).
# Fuente: docs/plans/research/F2-decisions.md (D2, orden unificado F2/F9).
# netinstall = instancia netinstall@nimbus (patrón biglinux-livecd).
# removeuser SOLO en OEM (comentado; descomentar únicamente en perfil OEM).
# finished va en show (canónico upstream), NO en exec.
modules-search: [ local ]

instances:
  - id: nimbus
    module: netinstall
    config: netinstall-nimbus.conf
  - id: nimbus
    module: shellprocess
    config: shellprocess-nimbus.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - netinstall@nimbus
      - summary
      - finished
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - grub
      - packages
      - netinstall@nimbus
      - services
      - shellprocess@nimbus
      - umount
      # - removeuser  # SOLO OEM (dont-chroot); NO descomentar en netinstall

branding: nimbus
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
