# NimbusOS — módulo packages (F2-T07). Esquema Calamares 3.4: operations.
backend: pacman
update_db: true
update_system: false
pacman:
    num_retries: 3
    disable_download_timeout: true
    needed_only: true
operations:
  - install:
      - base
      - linux
      - linux-firmware
      - mkinitcpio
      - grub
      - efibootmgr
      - btrfs-progs
      - snapper
      - grub-btrfs
      - sudo
      - nano
      - which
      - xdg-utils
      - xorg-server
      - xcb-util-cursor
      - plasma-meta
      - kwin
      - krunner
      - kdecoration
      - sddm
      - sddm-kcm
      - kde-gtk-config
      - kvantum
      - layer-shell-qt
      - power-profiles-daemon
      - powerdevil
      - polkit-kde-agent
      - networkmanager
      - plasma-nm
      # Dock Krema 0.12 (F5): runtime del dock y previews.
      - plasma-workspace
      - kirigami-addons
      - kpipewire
      - qt6-quick3d
      - qt6-wayland
      - firewalld
      - pipewire
      - pipewire-pulse
      - wireplumber
      - bluez
      - bluez-utils
      - cups
      - cups-pdf
      - inter-font
      - ttf-jetbrains-mono
      - noto-fonts
      - konsole
      - dolphin
      - spectacle
  - try_install:
      - btrfs-progs
      - snapper
      - grub-btrfs
  - remove:
      - calamares
      - archiso
      - mkinitcpio-archiso
