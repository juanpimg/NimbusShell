# NimbusOS — módulo packages (F2-T07, netinstall).
# Operaciones install (lista netinstall descargada) / try_install opcionales;
# remove de paquetes solo-live. Sin secretos ni rutas de usuario.
backend: pacman
update_db: true
install:
  - plasma-meta
  - kwin
  - krunner
  - sddm
  - sddm-kcm
  - kde-gtk-config
  - kvantum
  - layer-shell-qt
  - power-profiles-daemon
  - powerdevil
  - networkmanager
  - plasma-nm
  - firewalld
  - konsole
  - dolphin
  - spectacle
try_install:
  - btrfs-progs
  - snapper
remove:
  - calamares
  - archiso
  - mkinitcpio-archiso
