# NimbusOS — módulo packages (F2-T07, netinstall).
# Operaciones install (lista netinstall descargada) / try_install opcionales;
# remove de paquetes solo-live. Sin secretos ni rutas de usuario.
backend: pacman
update_db: true
install:
  # Base mínima del sistema instalado (el live no la hereda).
  - base
  - linux
  - linux-firmware
  - mkinitcpio
  - grub
  - efibootmgr
  - btrfs-progs
  - snapper
  - grub-btrfs
  - sudo
  - nano
  - which
  - xdg-utils
  - xorg-server
  - xcb-util-cursor
  # Escritorio Nimbus/Plasma.
  - plasma-meta
  - kwin
  - krunner
  - kdecoration
  - sddm
  - sddm-kcm
  - kde-gtk-config
  - kvantum
  - layer-shell-qt
  - power-profiles-daemon
  - powerdevil
  - polkit-kde-agent
  - networkmanager
  - plasma-nm
  - firewalld
  - pipewire
  - pipewire-pulse
  - wireplumber
  - bluez
  - bluez-utils
  - cups
  - cups-pdf
  - inter-font
  - ttf-jetbrains-mono
  - noto-fonts
  - konsole
  - dolphin
  - spectacle
try_install: []
remove:
  - calamares
  - archiso
  - mkinitcpio-archiso
