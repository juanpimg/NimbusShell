# NimbusOS — módulo partition (F2-T07). Guiado + LUKS opcional/recomendado
# (se ofrece, no se impone — F2-T09). btrfs por defecto con snapper.
efiSystemPartition: /boot/efi
efiSystemPartitionSize: 300M
enableLuks: true
luksGeneration: luks2
defaultFileSystemType: btrfs
defaultSubvolumes:
  - "@"
  - "@home"
  - "@snapshots"
  - "@log"
  - "@cache"
userSwapChoice: true
initialSwapChoice: file
drawNestedPartitions: true
