# NimbusOS — módulo partition (F2-T07, claves documentadas en F2-T09).
# Guiado + LUKS opcional/recomendado (se ofrece en la UI, no se impone:
# `enableLuks: true` muestra la casilla de cifrado; el flujo netinstall
# sigue intacto). btrfs por defecto con subvolúmenes para snapper.
#
# Claves (F2-T09): LUKS2 sin keyfiles — la passphrase la introduce el
# usuario en Calamares (módulo users/partition) y vive solo en su memoria;
# no se almacena copia en la ISO ni en el instalado. Pérdida de passphrase
# = pérdida de datos (sin recuperación); documentado al usuario en el
# resumen de instalación. Verificación en VM: tests/vm/security-check.sh
# (`cryptsetup status` sobre el mapeo de /).
efiSystemPartition: /boot/efi
efiSystemPartitionSize: 300M
enableLuks: true
luksGeneration: luks2
defaultFileSystemType: btrfs
defaultSubvolumes:
  - "@"
  - "@home"
  - "@snapshots"
  - "@log"
  - "@cache"
userSwapChoice: true
drawNestedPartitions: true

initialPartitioningChoice: erase
initialSwapChoice: none
