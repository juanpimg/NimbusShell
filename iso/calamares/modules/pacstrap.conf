# NimbusOS — pacstrap: base mínima antes de que `packages`/`netinstall`
# usen el pacman del target (F2-T07). El resto lo instala packages.conf.
basePackages:
  - base
  - linux
  - linux-firmware
  - mkinitcpio
  - btrfs-progs
  - efibootmgr
  - grub
  - sudo
  - which
  - xorg-server
  - xcb-util-cursor
  - networkmanager
postInstallFiles:
  - "/usr/local/bin/nimbus-installed-setup"
  - "/usr/local/bin/nimbus-bar"
  - "/usr/local/bin/nimbus-apps"
  - "/usr/local/bin/nimbus-spotlight"
  - "/usr/local/bin/nimbus-missioncontrol"
  - "/usr/local/bin/nimbus-welcome"
  - "/usr/local/bin/nimbus-about"
  - "/usr/local/bin/nimbus-help"
  - "/usr/local/bin/nimbus-theme"
  - "/usr/local/bin/nimbus-privacy"
  - "/usr/local/bin/nimbus-updates"
  - "/usr/local/bin/nimbus-layout"
  - "/usr/local/bin/nimbus-a11y"
  - "/usr/local/bin/nimbus-bar-preset"
  - "/usr/local/bin/nimbus-hw"
  - "/usr/local/bin/nimbus-backup"
  - "/usr/local/bin/nimbus-migrate-hyprland"
  - "/usr/local/bin/nimbus-migrate-desktop"
