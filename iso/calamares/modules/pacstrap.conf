# NimbusOS — pacstrap: base mínima antes de que `packages`/`netinstall`
# usen el pacman del target (F2-T07). El resto lo instala packages.conf.
basePackages:
  - base
  - linux
  - linux-firmware
  - mkinitcpio
  - btrfs-progs
  - efibootmgr
  - grub
  - sudo
  - which
  - xorg-server
  - xcb-util-cursor
  - networkmanager
postInstallFiles:
  - "/usr/local/bin/nimbus-installed-setup"
