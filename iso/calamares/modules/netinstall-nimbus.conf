# NimbusOS — instancia netinstall@nimbus (F2-T07). Grupo packagechooser:
# selección de componentes Plasma durante el show; la instalación la
# ejecuta el job packages/netinstall en exec. Sin secretos.
module: netinstall
groupsUrl: "file:///etc/calamares/groups-nimbus.json"
requiredGroups:
  - base
  - plasma
hiddenGroups:
  - base
defaultGroup: plasma
