# NimbusOS — módulo users (F2-T07). Autologin opcional (doAutologin).
defaultGroups:
  - audio
  - network
  - optical
  - storage
  - video
  - wheel
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: false
availableShells:
  - /bin/bash
  - /bin/zsh
  - /bin/fish
defaultShell: /bin/bash
