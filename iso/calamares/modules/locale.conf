# NimbusOS — módulo locale (F2-T07). es-ES por defecto, selector visible.
localeGenPath: /etc/locale.gen
localeConfPath: /etc/locale.conf
locales:
  - locale: es_ES.UTF-8
    name: "Español (España)"
  - locale: en_US.UTF-8
    name: "English (US)"
defaultLocale: es_ES.UTF-8
region: Europe
zone: Madrid
