# NimbusOS — módulo services (F2-T09).
# Habilita firewalld en el sistema instalado (zona por defecto `public`,
# valor upstream de firewalld). firewalld ya viaja en
# iso/profile/packages.x86_64 y en modules/packages.conf (install), así que
# aquí solo se activa el servicio; sin paquetes nuevos, sin romper el flujo
# netinstall (este módulo ya estaba en la secuencia exec de settings.conf).
systemd:
    enabled:
        - name: 'firewalld'
          mandatory: false
