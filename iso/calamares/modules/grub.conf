# NimbusOS — módulo grub (F2-T07). GRUB2 BIOS+UEFI (ver profiledef.sh).
installPath: /
efiDirectory: /boot/efi
grubCfg: /boot/grub/grub.cfg
grubProbe: /sbin/grub-probe
updateNVRAM: true
useFallback: false
kernel: /boot/vmlinuz-linux
img: /boot/initramfs-linux.img
fallback: /boot/initramfs-linux-fallback.img
timeout: "5"
default: "0"
distributor: NimbusOS
